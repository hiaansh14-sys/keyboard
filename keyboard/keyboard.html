<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyboard</title>
    <link rel="stylesheet" href="keyboard.css">
</head>

<body>
    <!--94.	Write code to implement a virtual keyboard: clicking <button class="key"> inserts its text into <input id="textBox">-->
    <button id="background">☽</button>
    <!-- ☀︎ -->

    <textarea name="t" id="textBox"></textarea>
    <br>
    <div id="maindiv">
        <button class="keyn ex">1</button>
        <button class="keyn ex">2</button>
        <button class="keyn ex">3</button>
        <button class="keyn ex">4</button>
        <button class="keyn ex">5</button>
        <button class="keyn ex">6</button>
        <button class="keyn ex">7</button>
        <button class="keyn ex">8</button>
        <button class="keyn ex">9</button>
        <button class="keyn ex">0</button><br>

        <!-- upper alphabet start -->
        <button class="key ex">Q</button>
        <button class="key ex">W</button>
        <button class="key ex">E</button>
        <button class="key ex">R</button>
        <button class="key ex">T</button>
        <button class="key ex">Y</button>
        <button class="key ex">U</button>
        <button class="key ex">I</button>
        <button class="key ex">O</button>
        <button class="key ex">P</button><br>

        <!-- second floor start -->
        <button class="key ex">A</button>
        <button class="key ex">S</button>
        <button class="key ex">D</button>
        <button class="key ex">F</button>
        <button class="key ex">G</button>
        <button class="key ex">H</button>
        <button class="key ex">J</button>
        <button class="key ex">K</button>
        <button class="key ex">L</button>
        <button id="additional" class="ex">)</button>
        <!-- second floor end -->

        <br>
        <button id="cap" class="ex">⇩</button>
        <!-- ⇧ -->
        <button class="key ex">Z</button>
        <button class="key ex">X</button>
        <button class="key ex">C</button>
        <button class="key ex">V</button>
        <button class="key ex">B</button>
        <button class="key ex">N</button>
        <button class="key ex">M</button>
        <button id="cross" class="ex">❌</button><br>

        <!-- lower key start -->
        <button id="symbol" class="ex">!#1</button>
        <button id="comma" class="ex">,</button>
        <button id="space" class="ex">space</button>
        <button id="dot" class="ex">.</button>
        <!-- lower key end -->
    </div>
    <div id="mainb"><button id="keyC">white</button>background image <button id="blank">blank</button>
        <ul>
           
            <li><button class="keybBtn btn1"></button></li>
            <li><button class="keybBtn btn2"></button></li>
            <li><button class="keybBtn btn3"></button></li>
            <li><button class="keybBtn btn4"></button></li>
            <li><button class="keybBtn btn5"></button></li>
            <li><button class="keybBtn btn6"></button></li>
            <li><button class="keybBtn btn7"></button></li>
            <li><button class="keybBtn btn8"></button></li>
            <li><button class="keybBtn btn9"></button></li>
            <li><button class="keybBtn btn10"></button></li>
            <li><button class="keybBtn btn11"></button></li>
            <li><button class="keybBtn btn12"></button></li>
            <li><button class="keybBtn btn13"></button></li>
            <li><button class="keybBtn btn14"></button></li>
        </ul>
    </div>
    <script src="keyboard.js"></script>
</body>
</html>
